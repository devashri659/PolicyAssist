<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PolicyAssist — Insurance Policy & Document Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3z' fill='%23287D5A'/></svg>">
</head>
<body>

  <!-- Top Navigation Header (Exact Reference Match) -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <a href="/" class="brand-logo" title="PolicyAssist Home">
          <svg class="logo-shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5V11C4 16.5 7.5 21.3 12 22C16.5 21.3 20 16.5 20 11V5L12 2Z" fill="#287D5A"/>
            <path d="M12 7V17M12 11L9.5 8.5M12 14L9 11M12 11L14.5 8.5M12 14L15 11" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          PolicyAssist
        </a>
        <div class="brand-divider"></div>
        <span class="brand-subtitle">Insurance Policy & Document Assistant</span>
      </div>

      <nav class="nav-menu">
        <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Home</span>
        </a>

        <a href="/policy" class="nav-link {% if active_page == 'policy' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Policies</span>
        </a>

        <a href="/documents" class="nav-link {% if active_page == 'documents' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Documents</span>
        </a>

        <a href="/help" class="nav-link {% if active_page == 'help' %}active{% endif %}">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span>Help</span>
        </a>
      </nav>

      <div class="user-profile-btn" title="User Profile">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </div>
  </header>

  <!-- Main Body Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <div>
        <strong>PolicyAssist</strong> &copy; 2026. Practical AI Assistant for Insurance Policies & Documentation.
      </div>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/policy">Understand Policy</a>
        <a href="/documents">Claim Checklist</a>
        <a href="/check-documents">Check Documents</a>
        <a href="/help">Help & Guide</a>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
